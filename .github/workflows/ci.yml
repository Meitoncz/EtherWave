name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  compile-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system audio libs (needed to import sounddevice/PySide6 headlessly)
        run: |
          sudo apt-get update
          # libasound2 was renamed libasound2t64 on Ubuntu 24.04+ (64-bit
          # time_t transition); install whichever exists on this runner.
          sudo apt-get install -y libportaudio2 desktop-file-utils \
            libegl1 libxkbcommon0 libxcb-cursor0 \
            $(apt-cache show libasound2t64 >/dev/null 2>&1 && echo libasound2t64 || echo libasound2)

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt Pillow

      - name: Byte-compile every module (catches syntax errors)
        run: python -m py_compile server/*.py client/*.py

      - name: Import + construct both main windows headlessly
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python - <<'PY'
          import sys

          sys.path.insert(0, "server")
          from PySide6.QtWidgets import QApplication
          app = QApplication(sys.argv)

          from gui import ServerMainWindow
          server_window = ServerMainWindow()
          server_window._quitting = True
          server_window.close()
          print("server GUI constructed OK")

          for name in ("discovery", "audio_engine", "gui"):
              sys.modules.pop(name, None)
          sys.path.remove("server")
          sys.path.insert(0, "client")

          from gui import ClientMainWindow
          client_window = ClientMainWindow()
          client_window._quitting = True
          client_window.close()
          print("client GUI constructed OK")
          PY

      - name: Regenerate icon (sanity-checks the Pillow script)
        run: python assets/generate_icon.py

      - name: Validate packaging metadata
        run: |
          desktop-file-validate packaging/arch/etherwave-server.desktop
          bash -n packaging/arch/etherwave-server.sh
          bash -n packaging/macos/build.sh
          bash -n packaging/macos/install.sh
          python -m py_compile packaging/macos/EtherWaveClient.spec
          python -c "import xml.dom.minidom as m; m.parse('packaging/macos/com.etherwave.client.plist')"

  compile-check-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-windows.txt

      - name: Byte-compile every module (catches syntax errors)
        run: python -m py_compile server_windows/*.py

      - name: Import + construct the main window headlessly
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -c @"
          import sys
          sys.path.insert(0, 'server_windows')
          from PySide6.QtWidgets import QApplication
          app = QApplication(sys.argv)
          from gui import ServerMainWindow
          window = ServerMainWindow()
          # Background QThreads (broadcaster/subscribers) started in
          # __init__ must be stopped before the process exits, or Windows
          # crashes the interpreter with STATUS_STACK_BUFFER_OVERRUN during
          # teardown (measured directly during development -- see
          # docs/WINDOWS_PORT.md). Going through the real _quitting +
          # close() path (rather than stopping the threads by hand) also
          # exercises the same teardown code a real quit takes.
          window._quitting = True
          window.close()
          print('server_windows GUI constructed OK')
          "@

      - name: Validate packaging metadata
        run: |
          python -m py_compile packaging/windows/EtherWaveServer.spec
          pwsh -NoProfile -Command "[scriptblock]::Create((Get-Content -Raw packaging/windows/build.ps1)) | Out-Null"
