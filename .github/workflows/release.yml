name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write  # required for softprops/action-gh-release to create the release

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set app version from git tag
        run: |
          # assets/VERSION is the single source of truth read by both GUIs'
          # About dialog and this .app's Info.plist (see
          # EtherWaveClient.spec) -- keep it in sync with the tag the same
          # way the Arch job keeps PKGBUILD's pkgver in sync, rather than
          # trusting whatever version happened to be checked in.
          echo "${GITHUB_REF_NAME#v}" > assets/VERSION  # v1.0.3 -> 1.0.3

      - name: Build EtherWave Client.app
        run: |
          cd packaging/macos
          chmod +x build.sh install.sh
          ./build.sh

      - name: Zip the app bundle
        env:
          VERSION: ${{ github.ref_name }}  # e.g. v1.0.3
        run: |
          cd packaging/macos/dist
          zip -r "EtherWave-Client-macOS-${VERSION}.zip" "EtherWave Client.app"

      - uses: actions/upload-artifact@v4
        with:
          name: EtherWave-Client-macOS
          path: packaging/macos/dist/EtherWave-Client-macOS-*.zip

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set app version from git tag
        shell: pwsh
        run: |
          # assets/VERSION is the single source of truth read by server_windows/gui.py's
          # About dialog and EtherWaveServer.spec -- kept in sync with the tag the
          # same way the macOS/Arch jobs do.
          $version = "${{ github.ref_name }}".TrimStart("v")  # v1.0.3 -> 1.0.3
          Set-Content -Path assets/VERSION -Value $version -NoNewline

      - name: Build EtherWave Server.exe
        shell: pwsh
        run: |
          .\packaging\windows\build.ps1

      - name: Zip the build output
        shell: pwsh
        env:
          VERSION: ${{ github.ref_name }}  # e.g. v1.0.3
        run: |
          Compress-Archive -Path "packaging\windows\dist\EtherWave Server" `
            -DestinationPath "packaging\windows\dist\EtherWave-Server-Windows-$env:VERSION.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: EtherWave-Server-Windows
          path: packaging/windows/dist/EtherWave-Server-Windows-*.zip

  build-arch:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    steps:
      - name: Install build tools and runtime deps
        run: |
          pacman -Sy --noconfirm base-devel git sudo \
            pyside6 python-numpy libpulse pipewire pipewire-pulse

      - uses: actions/checkout@v4

      - name: Set package version from git tag
        run: |
          # PKGBUILD's checked-in pkgver is just a sensible default for
          # local `makepkg -si` builds -- for an actual release, the tag
          # is the source of truth, so patch it in here rather than
          # relying on someone remembering to bump the file every release.
          # assets/VERSION is read by server/gui.py's About dialog at
          # runtime (gets copied into the package by the `cp -r assets`
          # step in PKGBUILD's package()), kept in sync the same way.
          VERSION="${GITHUB_REF_NAME#v}"  # v1.0.3 -> 1.0.3
          sed -i "s/^pkgver=.*/pkgver=${VERSION}/" packaging/arch/PKGBUILD
          sed -i "s/^pkgrel=.*/pkgrel=1/" packaging/arch/PKGBUILD
          echo "${VERSION}" > assets/VERSION

      - name: Build package as non-root (makepkg refuses to run as root)
        run: |
          useradd -m builder
          chown -R builder:builder .
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          su builder -c "cd packaging/arch && makepkg -f --noconfirm"

      - name: Rename release asset for consistent naming
        run: |
          # The actual Arch package name/file (etherwave-server-*, all
          # lowercase) is unchanged -- that's an Arch packaging convention
          # (pkgname must be lowercase), not a style choice, and pacman
          # reads the package metadata, not the filename, so renaming the
          # downloadable copy is purely cosmetic and doesn't affect
          # installability. This just makes the two release assets read
          # consistently on the GitHub Releases page.
          original=$(ls packaging/arch/*.pkg.tar.zst)
          cp "$original" "packaging/arch/EtherWave-Server-Arch-${GITHUB_REF_NAME}.pkg.tar.zst"

      - uses: actions/upload-artifact@v4
        with:
          name: EtherWave-Server-Arch
          path: packaging/arch/EtherWave-Server-Arch-*.pkg.tar.zst

  create-release:
    needs: [build-macos, build-windows, build-arch]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/EtherWave-Client-macOS/*.zip
            artifacts/EtherWave-Server-Windows/*.zip
            artifacts/EtherWave-Server-Arch/*.pkg.tar.zst
